services:
  - type: web
    name: csrs-project
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm ci --include=dev --prefix interface/backend && npm run build --prefix interface/backend && npm ci --include=dev --prefix interface/frontend && npm run build --prefix interface/frontend
    startCommand: npm start --prefix interface/backend
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_PATH
        value: "model/pipeline b/csrs_pipeline_b.db"
      - key: ARTIFACT_ROOT
        value: model
      - key: CACHE_TTL_SECONDS
        value: 120
      - key: CORS_ORIGIN
        value: https://csrs-project.onrender.com,https://siyabulela11.github.io
      - key: VITE_API_URL
        value: https://csrs-project.onrender.com
    healthCheckPath: /health
